[package]
name = "mod-stealer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Agent-Fleet controller for the native harvester and clipboard watcher"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
modsdk = { path = "../../crates/modsdk", features = [
    "fs-write",
    "exec",
    "net",
    "env",
] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
