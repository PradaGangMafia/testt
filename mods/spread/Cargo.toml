[package]
name = "mod-spread"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Agent-Fleet controller for the USB and LAN spread helper"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
modsdk = { path = "../../crates/modsdk", features = ["exec", "env"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
