[package]
name = "mod-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Agent-Fleet module template"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
modsdk = { path = "../../crates/modsdk" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
